<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sightra | Sign Up</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed-dim": "#abd600",
                        "primary-fixed": "#9cf0ff",
                        "on-surface-variant": "#bac9cc",
                        "secondary": "#ffffff",
                        "secondary-fixed": "#c3f400",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#161e00",
                        "inverse-on-surface": "#313030",
                        "surface-bright": "#393939",
                        "background": "#131313",
                        "tertiary": "#ffeac0",
                        "on-primary-fixed-variant": "#004f58",
                        "surface": "#131313",
                        "primary-fixed-dim": "#00daf3",
                        "surface-container-low": "#1c1b1b",
                        "on-tertiary-fixed-variant": "#594400",
                        "surface-container-high": "#2a2a2a",
                        "error": "#ffb4ab",
                        "secondary-container": "#c3f400",
                        "surface-container-highest": "#353534",
                        "on-primary-container": "#00626e",
                        "on-secondary": "#283500",
                        "inverse-surface": "#e5e2e1",
                        "surface-variant": "#353534",
                        "on-surface": "#e5e2e1",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "surface-dim": "#131313",
                        "surface-tint": "#00daf3",
                        "primary": "#c3f5ff",
                        "tertiary-fixed": "#ffdf96",
                        "surface-container": "#201f1f",
                        "on-primary-fixed": "#001f24",
                        "inverse-primary": "#006875",
                        "surface-container-lowest": "#0e0e0e",
                        "on-secondary-container": "#556d00",
                        "on-tertiary": "#3e2e00",
                        "primary-container": "#00e5ff",
                        "on-tertiary-container": "#6f5500",
                        "outline": "#849396",
                        "tertiary-fixed-dim": "#f3bf26",
                        "on-secondary-fixed-variant": "#3c4d00",
                        "on-background": "#e5e2e1",
                        "on-primary": "#00363d",
                        "outline-variant": "#3b494c",
                        "tertiary-container": "#fec931",
                        "on-tertiary-fixed": "#251a00"
                    },
                    fontFamily: {
                        headline: ["Lexend"],
                        display: ["Lexend"],
                        body: ["Inter"],
                        label: ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-panel { background: rgba(28, 27, 27, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
        .glow-cta { box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container min-h-screen py-12 flex flex-col items-center justify-center overflow-x-hidden">
    <div class="fixed inset-0 z-0 opacity-20 pointer-events-none">
        <div class="absolute top-[-10% ] left-[-10%] w-[60%] h-[60%] bg-primary-container/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary-container/10 blur-[100px] rounded-full"></div>
    </div>

    <main class="relative z-10 w-full max-w-xl px-6">
        <header class="mb-10 text-center">
            <h1 class="text-primary-container font-headline font-black tracking-tighter text-4xl mb-1">SIGHTRA</h1>
            <p class="text-on-surface-variant font-label tracking-[0.2em] uppercase text-[10px] font-bold">New Node Registration</p>
        </header>

        <section class="glass-panel p-8 rounded-[2.5rem] shadow-[0_0_60px_rgba(0,0,0,0.5)]">
            <div class="mb-8">
                <h2 class="font-headline font-bold text-2xl mb-1 text-primary">Create Account</h2>
                <p class="text-on-surface-variant text-sm">Provide your credentials and KYC details to join the network.</p>
            </div>

            <form class="space-y-8">
                <!-- Personal Info Section -->
                <div class="space-y-4">
                    <p class="text-[10px] font-bold text-primary-container/60 uppercase tracking-[0.2em] ml-2">Personal Information</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Full Name -->
                        <div class="relative group">
                            <input class="w-full h-14 pl-4 pr-4 bg-surface-container-lowest border-2 border-outline-variant/30 focus:border-primary-container/50 focus:ring-4 focus:ring-primary-container/10 rounded-xl text-on-surface font-medium transition-all peer placeholder-transparent outline-none" id="fullname" placeholder=" " type="text" />
                            <label class="absolute left-4 top-4 text-on-surface-variant/60 pointer-events-none transition-all peer-placeholder-shown:top-4 peer-focus:top-[-0.75rem] peer-focus:text-xs peer-focus:text-primary-container peer-focus:bg-surface-container-low peer-focus:px-2 peer-[:not(:placeholder-shown)]:top-[-0.75rem] peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:bg-surface-container-low peer-[:not(:placeholder-shown)]:px-2" for="fullname">Full Name</label>
                        </div>
                        <!-- Date of Birth -->
                        <div class="relative group">
                            <input class="w-full h-14 pl-4 pr-4 bg-surface-container-lowest border-2 border-outline-variant/30 focus:border-primary-container/50 focus:ring-4 focus:ring-primary-container/10 rounded-xl text-on-surface font-medium transition-all peer placeholder-transparent outline-none" id="dob" placeholder=" " type="date" />
                            <label class="absolute left-4 top-[-0.75rem] text-xs text-primary-container bg-surface-container-low px-2 pointer-events-none transition-all" for="dob">Date of Birth</label>
                        </div>
                    </div>
                </div>

                <!-- KYC Section -->
                <div class="space-y-4">
                    <p class="text-[10px] font-bold text-primary-container/60 uppercase tracking-[0.2em] ml-2">KYC Verification</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- ID Number -->
                        <div class="relative group">
                            <input class="w-full h-14 pl-4 pr-4 bg-surface-container-lowest border-2 border-outline-variant/30 focus:border-primary-container/50 focus:ring-4 focus:ring-primary-container/10 rounded-xl text-on-surface font-medium transition-all peer placeholder-transparent outline-none" id="idnumber" placeholder=" " type="text" />
                            <label class="absolute left-4 top-4 text-on-surface-variant/60 pointer-events-none transition-all peer-placeholder-shown:top-4 peer-focus:top-[-0.75rem] peer-focus:text-xs peer-focus:text-primary-container peer-focus:bg-surface-container-low peer-focus:px-2 peer-[:not(:placeholder-shown)]:top-[-0.75rem] peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:bg-surface-container-low peer-[:not(:placeholder-shown)]:px-2" for="idnumber">ID / Passport Number</label>
                        </div>
                        <!-- Phone Number -->
                        <div class="relative group">
                            <input class="w-full h-14 pl-4 pr-4 bg-surface-container-lowest border-2 border-outline-variant/30 focus:border-primary-container/50 focus:ring-4 focus:ring-primary-container/10 rounded-xl text-on-surface font-medium transition-all peer placeholder-transparent outline-none" id="phone" placeholder=" " type="tel" />
                            <label class="absolute left-4 top-4 text-on-surface-variant/60 pointer-events-none transition-all peer-placeholder-shown:top-4 peer-focus:top-[-0.75rem] peer-focus:text-xs peer-focus:text-primary-container peer-focus:bg-surface-container-low peer-focus:px-2 peer-[:not(:placeholder-shown)]:top-[-0.75rem] peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:bg-surface-container-low peer-[:not(:placeholder-shown)]:px-2" for="phone">Phone Number</label>
                        </div>
                    </div>
                </div>

                <!-- Account Security -->
                <div class="space-y-4">
                    <p class="text-[10px] font-bold text-primary-container/60 uppercase tracking-[0.2em] ml-2">Account Security</p>
                    <div class="relative group">
                        <input class="w-full h-14 pl-4 pr-4 bg-surface-container-lowest border-2 border-outline-variant/30 focus:border-primary-container/50 focus:ring-4 focus:ring-primary-container/10 rounded-xl text-on-surface font-medium transition-all peer placeholder-transparent outline-none" id="email" placeholder=" " type="email" />
                        <label class="absolute left-4 top-4 text-on-surface-variant/60 pointer-events-none transition-all peer-placeholder-shown:top-4 peer-focus:top-[-0.75rem] peer-focus:text-xs peer-focus:text-primary-container peer-focus:bg-surface-container-low peer-focus:px-2 peer-[:not(:placeholder-shown)]:top-[-0.75rem] peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:bg-surface-container-low peer-[:not(:placeholder-shown)]:px-2" for="email">Email Address</label>
                    </div>
                    <div class="relative group">
                        <input class="w-full h-14 pl-4 pr-12 bg-surface-container-lowest border-2 border-outline-variant/30 focus:border-primary-container/50 focus:ring-4 focus:ring-primary-container/10 rounded-xl text-on-surface font-medium transition-all peer placeholder-transparent outline-none" id="password" placeholder=" " type="password" />
                        <label class="absolute left-4 top-4 text-on-surface-variant/60 pointer-events-none transition-all peer-placeholder-shown:top-4 peer-focus:top-[-0.75rem] peer-focus:text-xs peer-focus:text-primary-container peer-focus:bg-surface-container-low peer-focus:px-2 peer-[:not(:placeholder-shown)]:top-[-0.75rem] peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:bg-surface-container-low peer-[:not(:placeholder-shown)]:px-2" for="password">Create Password</label>
                        <button class="absolute inset-y-0 right-4 flex items-center text-on-surface-variant" type="button">
                            <span class="material-symbols-outlined" data-icon="visibility">visibility</span>
                        </button>
                    </div>
                </div>

                <button class="w-full h-14 bg-gradient-to-br from-primary to-primary-container text-on-primary-container font-headline font-extrabold uppercase tracking-[0.2em] rounded-xl flex items-center justify-center gap-3 active:scale-[0.98] transition-all glow-cta" type="submit">
                    Complete Registration
                    <span class="material-symbols-outlined" data-icon="how_to_reg">how_to_reg</span>
                </button>
            </form>
        </section>

        <footer class="mt-8 text-center space-y-4">
            <p class="text-on-surface-variant text-sm">Already have an account? <a href="/signin/" class="text-primary font-bold hover:underline underline-offset-4">Sign In</a></p>
            <p class="text-on-surface-variant text-[10px] opacity-60 max-w-xs mx-auto">By registering, you certify that all KYC information provided is accurate and belongs to you.</p>
        </footer>
    </main>

    <div class="fixed inset-0 -z-10 opacity-20 overflow-hidden">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAcGy3IouVzwuqnjDqLBI44uINqgKAupmHX-hlyWiM6ALkHOw6wDnNrqGugFGfjp0iAWBCuxjRTjbAw3q3nkS49KGPxNZDuvtfyRjUtXURdVXPK6dUVypTv29zgFbfWEbKO4ZGKSWbaGjxmUAct79vdOh1jvSlsvGA7dWLqaBUNFF44k1LpgaOfxWiJoVp-rhpcwT9vKfSzH2Qz3xwy9b9vWaZbKaw73i0PmpmDGuF-x6Mz2NQTt95e5zMby4j7ywc1Smnqz4WDaEY4" class="w-full h-full object-cover mix-blend-overlay scale-110" />
    </div>
</body>
</html>
