{% extends "base.html" %}
{% block title %}Offline | Sightra{% endblock %}
{% block content %}
<section class="card mx-auto mt-16 max-w-md p-8 text-center">
  <span class="material-symbols-outlined text-5xl text-[var(--primary)]">cloud_off</span>
  <h1 class="font-headline mt-4 text-2xl font-semibold">You are offline</h1>
  <p class="mt-2 text-sm text-[var(--text-muted)]">Sightra will reconnect when your network returns.</p>
  <a href="/dashboard" class="btn-primary mt-6 inline-block">Go to dashboard</a>
</section>
{% endblock %}
