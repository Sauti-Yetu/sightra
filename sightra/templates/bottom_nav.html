<!-- BottomNavBar -->
<nav id="bottomNav"
    class="fixed bottom-0 left-0 w-full md:hidden flex justify-around items-center pb-6 pt-3 px-4 bg-[#131313]/80 backdrop-blur-xl z-50 border-t border-[#00E5FF]/10 shadow-[0_-10px_40px_rgba(0,229,255,0.08)] rounded-t-3xl">
    <a class="nav-link flex flex-col items-center justify-center text-[#BAC9CC] px-2 sm:px-6 py-2 hover:text-[#C3F400] transition-all active:scale-90 duration-300 ease-out"
        href="/" data-target="/">
        <span class="material-symbols-outlined text-2xl" data-icon="home">home</span>
        <span class="font-['Lexend'] text-[10px] font-medium tracking-wide">Home</span>
    </a>
    <a class="nav-link flex flex-col items-center justify-center text-[#BAC9CC] px-2 sm:px-6 py-2 hover:text-[#C3F400] transition-all active:scale-90 duration-300 ease-out"
        href="/vision/" data-target="/vision">
        <span class="material-symbols-outlined text-2xl" data-icon="visibility">visibility</span>
        <span class="font-['Lexend'] text-[10px] font-medium tracking-wide">Vision</span>
    </a>
    <a class="nav-link flex flex-col items-center justify-center text-[#BAC9CC] px-2 sm:px-6 py-2 hover:text-[#C3F400] transition-all active:scale-90 duration-300 ease-out"
        href="/voice_assistant/" data-target="/voice_assistant">
        <span class="material-symbols-outlined text-2xl" data-icon="mic"
            style="font-variation-settings: 'FILL' 1;">mic</span>
        <span class="font-['Lexend'] text-[10px] font-medium tracking-wide">Voice</span>
    </a>
    <a class="nav-link flex flex-col items-center justify-center text-[#BAC9CC] px-2 sm:px-6 py-2 hover:text-[#C3F400] transition-all active:scale-90 duration-300 ease-out"
        href="/settings/" data-target="/settings">
        <span class="material-symbols-outlined text-2xl" data-icon="settings">settings</span>
        <span class="font-['Lexend'] text-[10px] font-medium tracking-wide">Settings</span>
    </a>
</nav>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const path = window.location.pathname;
        const bottomLinks = document.querySelectorAll('#bottomNav .nav-link');
        const desktopLinks = document.querySelectorAll('#desktopNav .nav-link');

        bottomLinks.forEach(link => {
            const target = link.getAttribute('data-target');
            if (path === target || (target !== '/' && path.startsWith(target))) {
                link.classList.remove('text-[#BAC9CC]', 'hover:text-[#C3F400]');
                link.classList.add('bg-[#00E5FF]', 'text-[#131313]', 'rounded-2xl', 'scale-110');
            }
        });

        desktopLinks.forEach(link => {
            const target = link.getAttribute('data-target');
            if (path === target || (target !== '/' && path.startsWith(target))) {
                link.classList.remove('text-[#BAC9CC]');
                link.classList.add('text-[#00E5FF]', 'border-b-2', 'border-[#00E5FF]', 'pb-1');
            }
        });
    });
</script>
