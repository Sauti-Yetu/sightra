<section id="a11y-panel" class="a11y-panel" hidden aria-label="Accessibility settings">
  <h2 class="font-headline mb-3 text-base font-semibold">Accessibility</h2>
  <ul class="space-y-3 text-sm">
    <li class="flex items-center justify-between gap-3">
      <span>High contrast</span>
      <input type="checkbox" data-a11y-key="highContrast" aria-label="High contrast" />
    </li>
    <li class="flex items-center justify-between gap-3">
      <span>Reduce motion</span>
      <input type="checkbox" data-a11y-key="reduceMotion" aria-label="Reduce motion" />
    </li>
    <li class="flex items-center justify-between gap-3">
      <span>Voice feedback</span>
      <input type="checkbox" data-a11y-key="voiceFeedback" aria-label="Voice feedback for UI actions" />
    </li>
    <li class="flex items-center justify-between gap-3">
      <span>Larger text</span>
      <input type="checkbox" data-a11y-key="largeText" aria-label="Larger text" />
    </li>
  </ul>
</section>
