<div id="install-prompt" class="install-prompt" role="dialog" aria-labelledby="install-prompt-title" aria-describedby="install-prompt-desc">
  <p id="install-prompt-title" class="font-headline font-bold text-lg m-0">Install Sightra</p>
  <p id="install-prompt-desc" class="text-sm m-0" style="color: var(--color-text-secondary);">
    Add Sightra to your home screen for faster access to visual assistance.
  </p>
  <div class="flex gap-2">
    <button type="button" class="btn btn-primary flex-1" data-install-trigger>Install</button>
    <button type="button" class="btn btn-secondary" data-install-dismiss aria-label="Dismiss install prompt">Not now</button>
  </div>
</div>
