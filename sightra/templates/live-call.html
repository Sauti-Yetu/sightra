<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sightra Connect - Live Call</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00E5FF",
                        "surface": "#131313",
                        "surface-variant": "#201f1f",
                        "on-surface": "#e5e2e1",
                        "error": "#FF4B4B",
                    },
                    fontFamily: {
                        "headline": ["Lexend"],
                        "body": ["Inter"],
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(19, 19, 19, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror for local view usually, but for environment we might want it normal */
        }
        
        .video-container.remote video {
            transform: scaleX(1);
        }

        .pulse-red {
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 75, 75, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 75, 75, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 75, 75, 0); }
        }

        /* Hide scrollbars */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>

<body class="bg-surface text-on-surface font-body overflow-hidden h-screen w-screen">
    <!-- Header -->
    <header class="fixed top-0 w-full z-50 bg-surface/40 backdrop-blur-xl border-b border-white/5 flex justify-between items-center px-6 h-16 shadow-lg">
        <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
            <span class="material-symbols-outlined text-primary text-2xl">visibility</span>
            <h1 class="font-headline font-black text-xl uppercase tracking-tighter text-primary">Sightra</h1>
        </a>

        <div id="connection-status" class="flex items-center gap-2 glass-panel px-4 py-1.5 rounded-full border-white/10">
            <div class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse" id="status-dot"></div>
            <span class="text-xs font-bold uppercase tracking-widest text-on-surface/80" id="status-text">Starting Camera...</span>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden md:flex flex-col items-end">
                <span class="text-[10px] text-on-surface/40 uppercase font-black tracking-widest">Call Duration</span>
                <span id="call-timer" class="text-sm font-headline font-bold">00:00</span>
            </div>
        </div>
    </header>

    <main class="relative h-screen w-screen bg-black overflow-hidden">
        <!-- Main Video (User's Environment / Local Feed) -->
        <div id="local-video-container" class="video-container absolute inset-0 z-0 bg-surface-variant flex items-center justify-center">
            <div class="text-center space-y-4 opacity-40" id="local-placeholder">
                <span class="material-symbols-outlined text-6xl animate-pulse">videocam</span>
                <p class="text-sm uppercase tracking-widest font-black">Waiting for camera access...</p>
            </div>
        </div>

        <!-- Floating Video (Remote Volunteer Feed) -->
        <div class="absolute top-24 right-6 w-40 h-56 rounded-2xl overflow-hidden shadow-2xl border-2 border-white/10 z-20 glass-panel group transition-all duration-300 hover:scale-105" id="remote-video-wrapper">
            <div id="remote-video-container" class="video-container remote w-full h-full bg-surface-variant flex items-center justify-center">
                <div class="text-center space-y-2 opacity-40" id="remote-placeholder">
                    <span class="material-symbols-outlined text-4xl">person_search</span>
                </div>
            </div>
            <div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/80 to-transparent">
                <p class="text-[10px] font-bold uppercase tracking-widest text-primary" id="remote-name">Waiting...</p>
            </div>
        </div>

        <!-- Guidance Overlay -->
        <div class="absolute top-24 left-6 z-20 max-w-xs space-y-3" id="guidance-overlay">
            <div class="glass-panel p-4 rounded-2xl shadow-xl border-l-4 border-primary">
                <p class="text-xs leading-relaxed text-on-surface/90 italic">
                    "Streaming your environment to a volunteer. Keep your device steady for better assistance."
                </p>
            </div>
        </div>

        <!-- Call Controls -->
        <div class="absolute bottom-10 left-0 right-0 z-40 flex flex-col items-center gap-6">
            <div class="glass-panel p-4 rounded-full flex items-center gap-4 shadow-2xl backdrop-blur-2xl border-white/10">
                <!-- Mic Toggle -->
                <button id="mic-toggle" class="w-14 h-14 rounded-full flex items-center justify-center transition-all hover:bg-white/10 active:scale-90 group">
                    <span class="material-symbols-outlined text-2xl group-hover:text-primary" id="mic-icon">mic</span>
                </button>

                <!-- Camera Toggle -->
                <button id="camera-toggle" class="w-14 h-14 rounded-full flex items-center justify-center transition-all hover:bg-white/10 active:scale-90 group">
                    <span class="material-symbols-outlined text-2xl group-hover:text-primary" id="camera-icon">videocam</span>
                </button>

                <!-- End Call -->
                <button id="end-call" class="w-20 h-14 bg-error text-white rounded-full flex items-center justify-center shadow-lg shadow-error/30 hover:brightness-110 active:scale-95 transition-all">
                    <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">call_end</span>
                </button>

                <!-- Info Toggle -->
                <button class="w-14 h-14 rounded-full flex items-center justify-center transition-all hover:bg-white/10 active:scale-90">
                    <span class="material-symbols-outlined text-2xl">info</span>
                </button>
            </div>

            <!-- AI Vision Insight -->
            <div class="px-6 py-2 rounded-full glass-panel border-primary/20 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-primary animate-ping"></span>
                <span class="text-[10px] font-black uppercase tracking-[0.2em] text-primary" id="call-type">Live Stream Call</span>
            </div>
        </div>
    </main>

    <!-- Script for LiveKit Logic -->
    <script>
        const { Room, RemoteParticipant, RoomEvent, VideoPresets, Track, createLocalVideoTrack } = LiveKitClient;

        let room;
        let startTime;
        let timerInterval;
        let localVideoTrack;

        const livekitUrl = "{{ livekit_url }}";
        const roomName = "sightra-call";
        const participantName = "User_" + Math.floor(Math.random() * 1000);

        async function startCall() {
            try {
                // 1. Start Camera Preview IMMEDIATELY
                updateStatus('Starting Camera...', 'yellow');
                localVideoTrack = await createLocalVideoTrack({
                    facingMode: 'environment', // User environment
                    resolution: VideoPresets.h720.resolution
                });
                
                const container = document.getElementById('local-video-container');
                container.innerHTML = '';
                container.appendChild(localVideoTrack.attach());
                document.getElementById('local-placeholder').classList.add('hidden');

                // 2. Get Token and Connect
                updateStatus('Connecting to Volunteer...', 'yellow');
                const response = await fetch(`/api/volunteer/token/?room=${roomName}&name=${participantName}`);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);
                const token = data.token;

                room = new Room({
                    adaptiveStream: true,
                    dynacast: true,
                });

                room
                    .on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
                        if (track.kind === 'video') {
                            const element = track.attach();
                            const container = document.getElementById('remote-video-container');
                            container.innerHTML = '';
                            container.appendChild(element);
                            document.getElementById('remote-placeholder').classList.add('hidden');
                            document.getElementById('remote-name').innerText = participant.identity || 'Volunteer';
                        } else if (track.kind === 'audio') {
                            track.attach();
                        }
                    })
                    .on(RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
                        track.detach();
                        if (track.kind === 'video') {
                            document.getElementById('remote-video-container').innerHTML = `
                                <div class="text-center space-y-2 opacity-40" id="remote-placeholder">
                                    <span class="material-symbols-outlined text-4xl">person_search</span>
                                </div>
                            `;
                            document.getElementById('remote-name').innerText = 'Waiting...';
                        }
                    })
                    .on(RoomEvent.Connected, () => {
                        updateStatus('Connected Live', 'green');
                        startTimer();
                    })
                    .on(RoomEvent.Disconnected, () => {
                        updateStatus('Disconnected', 'red');
                        stopTimer();
                    });

                await room.connect(livekitUrl, token);
                
                // 3. Publish Local Tracks
                await room.localParticipant.publishTrack(localVideoTrack);
                await room.localParticipant.setMicrophoneEnabled(true);

            } catch (error) {
                console.error('Call initialization failed:', error);
                updateStatus('Error: ' + error.message, 'red');
            }
        }

        function updateStatus(text, color) {
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            statusText.innerText = text;
            
            statusDot.className = 'w-2 h-2 rounded-full';
            if (color === 'green') statusDot.classList.add('bg-green-500');
            else if (color === 'red') statusDot.classList.add('bg-error', 'pulse-red');
            else if (color === 'yellow') statusDot.classList.add('bg-yellow-400', 'animate-pulse');
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const minutes = Math.floor(elapsed / 60000);
                const seconds = Math.floor((elapsed % 60000) / 1000);
                document.getElementById('call-timer').innerText = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        // Controls
        document.getElementById('mic-toggle').addEventListener('click', async () => {
            if (!room) return;
            const enabled = room.localParticipant.isMicrophoneEnabled;
            await room.localParticipant.setMicrophoneEnabled(!enabled);
            document.getElementById('mic-icon').innerText = !enabled ? 'mic' : 'mic_off';
            document.getElementById('mic-toggle').classList.toggle('text-error', enabled);
        });

        document.getElementById('camera-toggle').addEventListener('click', async () => {
            if (!localVideoTrack) return;
            const enabled = localVideoTrack.isEnabled;
            localVideoTrack.setEnabled(!enabled);
            document.getElementById('camera-icon').innerText = !enabled ? 'videocam' : 'videocam_off';
            document.getElementById('camera-toggle').classList.toggle('text-error', enabled);
            document.getElementById('local-video-container').style.opacity = !enabled ? '1' : '0.3';
        });

        document.getElementById('end-call').addEventListener('click', () => {
            if (room) room.disconnect();
            window.location.href = '/';
        });

        window.addEventListener('load', startCall);
    </script>
</body>

</html>
