<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sightra | Sign In</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;700;900&amp;family=Inter:wght@300;400;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#abd600",
                        "primary-fixed": "#9cf0ff",
                        "on-surface-variant": "#bac9cc",
                        "secondary": "#ffffff",
                        "secondary-fixed": "#c3f400",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#161e00",
                        "inverse-on-surface": "#313030",
                        "surface-bright": "#393939",
                        "background": "#131313",
                        "tertiary": "#ffeac0",
                        "on-primary-fixed-variant": "#004f58",
                        "surface": "#131313",
                        "primary-fixed-dim": "#00daf3",
                        "surface-container-low": "#1c1b1b",
                        "on-tertiary-fixed-variant": "#594400",
                        "surface-container-high": "#2a2a2a",
                        "error": "#ffb4ab",
                        "secondary-container": "#c3f400",
                        "surface-container-highest": "#353534",
                        "on-primary-container": "#00626e",
                        "on-secondary": "#283500",
                        "inverse-surface": "#e5e2e1",
                        "surface-variant": "#353534",
                        "on-surface": "#e5e2e1",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "surface-dim": "#131313",
                        "surface-tint": "#00daf3",
                        "primary": "#c3f5ff",
                        "tertiary-fixed": "#ffdf96",
                        "surface-container": "#201f1f",
                        "on-primary-fixed": "#001f24",
                        "inverse-primary": "#006875",
                        "surface-container-lowest": "#0e0e0e",
                        "on-secondary-container": "#556d00",
                        "on-tertiary": "#3e2e00",
                        "primary-container": "#00e5ff",
                        "on-tertiary-container": "#6f5500",
                        "outline": "#849396",
                        "tertiary-fixed-dim": "#f3bf26",
                        "on-secondary-fixed-variant": "#3c4d00",
                        "on-background": "#e5e2e1",
                        "on-primary": "#00363d",
                        "outline-variant": "#3b494c",
                        "tertiary-container": "#fec931",
                        "on-tertiary-fixed": "#251a00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Lexend"],
                        "display": ["Lexend"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(28, 27, 27, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        input:focus+label,
        input:not(:placeholder-shown)+label {
            /* Handled by Tailwind peer-focus and peer-[:not(:placeholder-shown)] */
        }

        .glow-cta {
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .glow-cta:active {
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col items-center justify-center overflow-x-hidden">
    <!-- Hero Background Element -->
    <div class="fixed inset-0 z-0 opacity-20 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-primary-container/20 blur-[120px] rounded-full">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary-container/10 blur-[100px] rounded-full">
        </div>
    </div>
    <!-- Main Content Canvas -->
    <main class="relative z-10 w-full max-w-md px-6 py-12">
        <!-- Header Section -->
        <header class="mb-12 text-center">
            <h1 class="text-primary-container font-headline font-black tracking-tighter text-5xl mb-2">SIGHTRA</h1>
            <!-- <p class="text-on-surface-variant font-label tracking-widest uppercase text-[10px] font-bold">Augmented -->
            <!-- Navigation System</p> -->
        </header>
        <!-- Sign In Form -->
        <section class="glass-panel p-8 rounded-[2.5rem] shadow-[0_0_60px_rgba(0,0,0,0.5)]">
            <div class="mb-8">
                <h2 class="text-display-lg font-headline font-bold text-3xl mb-1 text-primary">Identity Check</h2>
                <p class="text-on-surface-variant text-sm">Please authenticate to access the beacon grid.</p>
            </div>
            <form class="space-y-6">
                <!-- Email Input -->
                <div class="relative group">
                    <div
                        class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary-container transition-colors">
                        <span class="material-symbols-outlined" data-icon="alternate_email">alternate_email</span>
                    </div>
                    <input
                        class="w-full h-16 pl-14 pr-4 bg-surface-container-lowest border-2 border-outline-variant/30 focus:border-primary-container/50 focus:ring-4 focus:ring-primary-container/10 rounded-2xl text-on-surface font-medium transition-all peer placeholder-transparent outline-none"
                        id="email" placeholder=" " type="email" />
                    <label
                        class="absolute left-14 top-5 text-on-surface-variant/60 pointer-events-none transition-all peer-placeholder-shown:top-5 peer-focus:top-[-0.75rem] peer-focus:text-xs peer-focus:text-primary-container peer-focus:bg-surface-container-low peer-focus:px-2 peer-[:not(:placeholder-shown)]:top-[-0.75rem] peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:bg-surface-container-low peer-[:not(:placeholder-shown)]:px-2"
                        for="email">Email Address</label>
                </div>
                <!-- Password Input -->
                <div class="relative group">
                    <div
                        class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary-container transition-colors">
                        <span class="material-symbols-outlined" data-icon="lock">lock</span>
                    </div>
                    <input
                        class="w-full h-16 pl-14 pr-12 bg-surface-container-lowest border-2 border-outline-variant/30 focus:border-primary-container/50 focus:ring-4 focus:ring-primary-container/10 rounded-2xl text-on-surface font-medium transition-all peer placeholder-transparent outline-none"
                        id="password" placeholder=" " type="password" />
                    <label
                        class="absolute left-14 top-5 text-on-surface-variant/60 pointer-events-none transition-all peer-placeholder-shown:top-5 peer-focus:top-[-0.75rem] peer-focus:text-xs peer-focus:text-primary-container peer-focus:bg-surface-container-low peer-focus:px-2 peer-[:not(:placeholder-shown)]:top-[-0.75rem] peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:bg-surface-container-low peer-[:not(:placeholder-shown)]:px-2"
                        for="password">Password</label>
                    <button
                        class="absolute inset-y-0 right-4 flex items-center text-on-surface-variant hover:text-primary transition-colors"
                        type="button">
                        <span class="material-symbols-outlined" data-icon="visibility">visibility</span>
                    </button>
                </div>
                <div class="flex justify-end">
                    <a class="text-xs font-bold text-primary-container/80 hover:text-primary transition-colors uppercase tracking-wider"
                        href="#">Forgot password?</a>
                </div>
                <!-- Primary CTA -->
                <button
                    class="w-full h-14 bg-gradient-to-br from-primary to-primary-container text-on-primary-container font-headline font-extrabold uppercase tracking-[0.2em] rounded-xl flex items-center justify-center gap-3 active:scale-[0.98] transition-all glow-cta"
                    type="submit">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
                </button>
            </form>
            <!-- Biometric Accessibility Section -->
            <div class="mt-10 pt-8 border-t border-outline-variant/20">
                <p class="text-center text-[10px] font-label text-on-surface-variant uppercase tracking-[0.2em] mb-6">
                    Biometric Accessibility</p>
                <div class="flex justify-center gap-8">
                    <button class="group flex flex-col items-center gap-3">
                        <div
                            class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center text-secondary-fixed group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-all active:scale-90">
                            <span class="material-symbols-outlined !text-3xl" data-icon="faceid">face</span>
                        </div>
                        <span
                            class="text-[10px] font-bold text-on-surface-variant group-hover:text-secondary-fixed uppercase tracking-wider">FaceID</span>
                    </button>
                    <button class="group flex flex-col items-center gap-3">
                        <div
                            class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center text-secondary-fixed group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-all active:scale-90">
                            <span class="material-symbols-outlined !text-3xl" data-icon="fingerprint">fingerprint</span>
                        </div>
                        <span
                            class="text-[10px] font-bold text-on-surface-variant group-hover:text-secondary-fixed uppercase tracking-wider">TouchID</span>
                    </button>
                </div>
            </div>
        </section>
        <!-- Secondary CTA -->
        <footer class="mt-8 flex flex-col items-center gap-4">
            <a href="/signup/"
                class="w-full h-14 bg-surface-container-high text-primary font-headline font-bold uppercase tracking-widest rounded-xl hover:bg-surface-variant active:scale-[0.98] transition-all flex items-center justify-center">
                Create an account
            </a>
            <p class="text-on-surface-variant text-[11px] text-center max-w-[280px] leading-relaxed">
                By authenticating, you agree to Sightra's <a class="text-primary underline underline-offset-2"
                    href="#">Terms of Sync</a> and <a class="text-primary underline underline-offset-2" href="#">Neural
                    Privacy Protocols</a>.
            </p>
        </footer>
    </main>
    <!-- Visual Anchor Decorations -->
    <div class="fixed bottom-12 left-1/2 -translate-x-1/2 flex gap-1 z-0">
        <div class="w-12 h-1 bg-primary-container rounded-full opacity-20"></div>
        <div class="w-4 h-1 bg-primary-container rounded-full opacity-40"></div>
        <div class="w-1 h-1 bg-primary-container rounded-full opacity-60"></div>
    </div>
    <!-- Background Image Asset (Abstract Tech) -->
    <div class="fixed inset-0 -z-10 opacity-30 overflow-hidden">
        <img alt="Sightra Network" class="w-full h-full object-cover mix-blend-overlay scale-110"
            data-alt="A cinematic, ultra-wide abstract shot of glowing blue fiber optic cables and digital neural pathways pulsing with light against a deep charcoal void. The lighting is dominated by high-contrast cyan and electric lime green highlights that trace the data streams. The aesthetic is sophisticated and futuristic, mimicking the interior of a high-speed data mainframe. The mood is silent, powerful, and technologically advanced."
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAcGy3IouVzwuqnjDqLBI44uINqgKAupmHX-hlyWiM6ALkHOw6wDnNrqGugFGfjp0iAWBCuxjRTjbAw3q3nkS49KGPxNZDuvtfyRjUtXURdVXPK6dUVypTv29zgFbfWEbKO4ZGKSWbaGjxmUAct79vdOh1jvSlsvGA7dWLqaBUNFF44k1LpgaOfxWiJoVp-rhpcwT9vKfSzH2Qz3xwy9b9vWaZbKaw73i0PmpmDGuF-x6Mz2NQTt95e5zMby4j7ywc1Smnqz4WDaEY4" />
    </div>
</body>

</html>
