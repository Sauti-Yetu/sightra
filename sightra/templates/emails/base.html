<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ subject|default:"Sightra" }}</title>
</head>
<body style="font-family:Inter,Segoe UI,sans-serif;color:#0a0a0a;line-height:1.5">
  {{ content|safe }}
  <hr style="border:none;border-top:1px solid #e5e7eb;margin:24px 0" />
  <p style="font-size:12px;color:#374151;line-height:1.5">
    {{ legal.operator_name }} · {{ legal.product_name }}<br>
    <a href="{{ legal.website_url }}/legal/privacy-policy/">Privacy Policy</a> ·
    <a href="{{ legal.website_url }}/legal/unsubscribe/{% if recipient_email %}?email={{ recipient_email|urlencode }}{% endif %}">Unsubscribe from optional emails</a><br>
    Questions: <a href="mailto:{{ legal.contact_email }}">{{ legal.contact_email }}</a>
  </p>
</body>
</html>
