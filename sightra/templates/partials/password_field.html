<div class="password-field relative">
  <input
    id="{{ field_id }}"
    name="{{ field_name|default:field_id }}"
    type="password"
    required
    {% if minlength %}minlength="{{ minlength }}"{% endif %}
    autocomplete="{{ autocomplete|default:'current-password' }}"
    class="w-full rounded-xl border-0 bg-[var(--bg-muted)] py-3 pl-4 pr-12 text-sm ring-1 ring-black/5 focus:ring-2 focus:ring-[var(--primary)] dark:ring-white/10"
  />
  <button
    type="button"
    class="password-toggle icon-btn absolute right-1 top-1/2 -translate-y-1/2"
    aria-label="Show password"
    aria-controls="{{ field_id }}"
    data-password-target="{{ field_id }}"
  >
    <span class="material-symbols-outlined text-xl" aria-hidden="true">visibility</span>
  </button>
</div>
