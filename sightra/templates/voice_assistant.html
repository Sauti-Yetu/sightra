{% extends "base.html" %}
{% block title %}Voice assistant | Sightra{% endblock %}
{% block content %}
<section class="mb-8 text-center">
  <div class="mx-auto flex h-28 w-28 items-center justify-center rounded-full bg-[var(--primary-soft)]">
    <span class="material-symbols-outlined text-5xl text-[var(--primary-strong)]" style="font-variation-settings:'FILL' 1">mic</span>
  </div>
  <h1 class="font-headline mt-6 text-3xl font-semibold">Voice assistant</h1>
  <p class="mx-auto mt-2 max-w-md text-[var(--text-muted)]">Ask about your surroundings. Tap the mic and speak clearly.</p>
  <button type="button" id="voice-listen" class="btn-primary mt-8 min-w-[12rem]" aria-label="Start listening">Tap to speak</button>
  <p id="voice-status" class="mt-4 text-sm text-[var(--text-muted)]" aria-live="polite">Ready</p>
</section>

<section class="card mx-auto max-w-2xl p-6">
  <h2 class="font-headline text-sm font-semibold uppercase tracking-wide text-[var(--text-muted)]">Recent</h2>
  <div id="voice-transcript" class="mt-4 space-y-4 text-sm">
    <p class="text-[var(--text-muted)]">Your conversation will appear here.</p>
  </div>
</section>
{% endblock %}
{% block page_scripts %}
<script>
  const listenBtn = document.getElementById('voice-listen');
  const statusEl = document.getElementById('voice-status');
  const transcriptEl = document.getElementById('voice-transcript');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  listenBtn?.addEventListener('click', async () => {
    const micOk = await window.SightraPrivacy?.requireFeatureConsent?.(
      window.SightraPrivacy?.CONSENT_MIC,
      'Voice assistant uses your microphone in the browser. Allow microphone consent for Sightra?'
    );
    if (!micOk) return;
    if (!SpeechRecognition) {
      statusEl.textContent = 'Speech recognition is not supported in this browser.';
      return;
    }
    const rec = new SpeechRecognition();
    rec.lang = 'en-US';
    rec.interimResults = false;
    statusEl.textContent = 'Listening…';
    window.SightraUI?.announce('Listening');
    rec.onresult = (event) => {
      const text = event.results[0][0].transcript;
      statusEl.textContent = 'Heard: ' + text;
      transcriptEl.innerHTML = `<div class="rounded-xl bg-[var(--bg-muted)] p-4"><strong>You:</strong> ${text}</div>`;
      window.SightraUI?.speak(text);
    };
    rec.onerror = () => { statusEl.textContent = 'Could not capture speech. Try again.'; };
    rec.onend = () => { if (statusEl.textContent === 'Listening…') statusEl.textContent = 'Ready'; };
    rec.start();
  });
</script>
{% endblock %}
