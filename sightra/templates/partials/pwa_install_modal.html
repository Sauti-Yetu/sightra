<div id="pwa-install-modal" class="fixed inset-0 z-[60] flex items-end justify-center p-4 sm:items-center" hidden role="dialog" aria-modal="true" aria-labelledby="pwa-install-modal-title">
  <button type="button" id="pwa-install-modal-backdrop" class="absolute inset-0 bg-black/50" aria-label="Close install instructions"></button>
  <div class="relative w-full max-w-md rounded-2xl bg-[var(--surface)] p-6 shadow-xl">
    <div class="flex items-start justify-between gap-3">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.15em] text-[var(--brand-blue)]">Install app</p>
        <h2 id="pwa-install-modal-title" class="font-headline mt-1 text-xl font-semibold">Get Sightra on your device</h2>
      </div>
      <button type="button" id="pwa-install-modal-close" class="icon-btn shrink-0" aria-label="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <p id="pwa-install-modal-lead" class="mt-3 text-sm text-[var(--text-muted)]"></p>
    <ol id="pwa-install-modal-steps" class="mt-4 space-y-3 text-sm"></ol>
    <div class="mt-6 flex flex-col gap-2 sm:flex-row">
      <button type="button" id="pwa-install-modal-action" class="btn-primary flex-1 text-sm">Install now</button>
      <button type="button" id="pwa-install-modal-dismiss" class="btn-secondary flex-1 text-sm">Not now</button>
    </div>
  </div>
</div>
