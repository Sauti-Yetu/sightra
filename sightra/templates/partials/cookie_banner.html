<div id="cookie-banner" class="cookie-banner" hidden role="dialog" aria-modal="false" aria-labelledby="cookie-banner-title">

    <div>
      <h2 id="cookie-banner-title" class="font-headline text-base font-semibold">Cookies on Sightra</h2>
      <p class="mt-1 text-sm text-[var(--text-muted)]">
        We use essential cookies so you can sign in and so forms stay secure.
        Optional analytics cookies are off unless you accept them.
        <a href="/legal/cookie-policy/" class="underline">Cookie Policy</a>
      </p>
    </div>
    <div class="mt-4 flex flex-col gap-2 sm:flex-row sm:flex-wrap">
      <button type="button" id="cookie-reject" class="btn-secondary flex-1 text-sm">Reject optional</button>
      <button type="button" id="cookie-accept" class="btn-primary flex-1 text-sm">Accept optional</button>
    </div>
  </div>
</div>
