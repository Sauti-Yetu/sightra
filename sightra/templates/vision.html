<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SIGHTRA | Live Perception</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;family=Inter:wght@100..900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "inverse-surface": "#e5e2e1",
                        "secondary-fixed": "#c3f400",
                        "on-secondary": "#283500",
                        "tertiary": "#ffeac0",
                        "on-tertiary-container": "#6f5500",
                        "surface-variant": "#353534",
                        "on-surface-variant": "#bac9cc",
                        "surface-container": "#201f1f",
                        "secondary": "#ffffff",
                        "tertiary-fixed-dim": "#f3bf26",
                        "on-primary-container": "#00626e",
                        "inverse-primary": "#006875",
                        "surface": "#131313",
                        "on-background": "#e5e2e1",
                        "inverse-on-surface": "#313030",
                        "on-secondary-container": "#556d00",
                        "background": "#131313",
                        "on-surface": "#e5e2e1",
                        "primary-fixed": "#9cf0ff",
                        "on-primary": "#00363d",
                        "surface-tint": "#00daf3",
                        "secondary-container": "#c3f400",
                        "on-secondary-fixed": "#161e00",
                        "surface-container-high": "#2a2a2a",
                        "tertiary-container": "#fec931",
                        "primary-container": "#00e5ff",
                        "on-secondary-fixed-variant": "#3c4d00",
                        "surface-container-low": "#1c1b1b",
                        "error": "#ffb4ab",
                        "on-primary-fixed": "#001f24",
                        "surface-bright": "#393939",
                        "secondary-fixed-dim": "#abd600",
                        "primary": "#c3f5ff",
                        "on-tertiary": "#3e2e00",
                        "on-primary-fixed-variant": "#004f58",
                        "surface-container-lowest": "#0e0e0e",
                        "primary-fixed-dim": "#00daf3",
                        "outline": "#849396",
                        "surface-dim": "#131313",
                        "outline-variant": "#3b494c",
                        "tertiary-fixed": "#ffdf96",
                        "on-tertiary-fixed-variant": "#594400",
                        "surface-container-highest": "#353534",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "on-tertiary-fixed": "#251a00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Lexend"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .scanline {
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 229, 255, 0.05) 50%, transparent 100%);
            background-size: 100% 4px;
        }

        .reticle-corner {
            width: 20px;
            height: 20px;
            border-color: #00E5FF;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background text-on-surface font-body overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
    <!-- Live Camera Feed (Background Canvas) -->
    <div class="fixed inset-0 z-0 bg-black">
        <video id="cameraElement" class="w-full h-full object-cover" autoplay playsinline></video>
        <canvas id="canvasElement" style="display:none;"></canvas>
    </div>
    <!-- UI Overlay Layer -->
    <div class="relative z-10 h-screen flex flex-col justify-between">
        <!-- Shared Component: TopAppBar -->
        <header
            class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-neutral-950/80 backdrop-blur-xl shadow-[0_0_40px_rgba(0,229,255,0.08)]">
            <div class="flex items-center gap-3"><a href="/">
                    <span class="material-symbols-outlined text-cyan-400" data-icon="visibility">visibility</span>
                    <span
                        class="text-cyan-400 dark:text-cyan-400 font-lexend font-black tracking-tighter text-xl">SIGHTRA</span>
                </a>
            </div>
            <!-- AI Status Indicators -->
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-secondary-container shadow-[0_0_10px_#C3F400]"></div>
                    <!-- <span
                        class="font-headline text-[10px] tracking-[0.2em] font-bold text-secondary-fixed uppercase">ONLINE</span> -->
                </div>
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-cyan-400 text-sm" data-icon="gps_fixed">gps_fixed</span>
                    <span
                        class="font-headline text-[10px] tracking-[0.2em] font-bold text-on-surface-variant uppercase">GPS
                        LOCKED</span>
                </div>
                <!-- <span class="material-symbols-outlined text-cyan-400 hover:opacity-80 transition-opacity"
                    data-icon="battery_charging_full">battery_charging_full</span> -->
            </div>
        </header>
        <!-- Perception Bounding Boxes (Main Canvas) -->
        <main id="dynamic-boxes" class="flex-1 relative mt-16 mb-24 overflow-hidden pointer-events-none">
            <!-- Center Viewport Guide (Static fallback) -->
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="relative w-48 h-48 flex items-center justify-center">
                    <div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-primary/30"></div>
                    <div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-primary/30"></div>
                    <div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-primary/30"></div>
                    <div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-primary/30"></div>
                    <div class="w-1 h-1 bg-primary-container rounded-full shadow-[0_0_15px_#00E5FF]"></div>
                </div>
            </div>
        </main>
        <!-- SIGHT Trigger & Navigation -->
        <footer class="relative z-20">
            <!-- Large Trigger Button -->
            <div class="absolute bottom-28 left-1/2 -translate-x-1/2 flex flex-col items-center gap-4">
                <span id="scanLabel"
                    class="font-headline text-[10px] tracking-[0.4em] font-black text-primary-container animate-pulse uppercase">INITIATE
                    SIGHT SCAN</span>
                <button id="scanBtn"
                    class="group relative w-24 h-24 rounded-full flex items-center justify-center transition-all duration-500 hover:scale-110 active:scale-95 pointer-events-auto">
                    <!-- Outer Ring -->
                    <div
                        class="absolute inset-0 rounded-full border-4 border-primary-container/20 group-hover:border-primary-container/40 transition-all">
                    </div>
                    <!-- Inner Circle -->
                    <div
                        class="w-16 h-16 rounded-full bg-primary-container/10 backdrop-blur-2xl flex items-center justify-center shadow-[0_0_30px_rgba(0,229,255,0.3)] group-hover:bg-primary-container/20 group-hover:shadow-[0_0_50px_rgba(0,229,255,0.5)] transition-all">
                        <span class="material-symbols-outlined text-primary-container text-4xl" data-icon="visibility"
                            style="font-variation-settings: 'FILL' 1;">visibility</span>
                    </div>
                </button>
            </div>
        </footer>
        <!-- HUD Side Metrics -->
        <aside class="fixed left-6 top-1/2 -translate-y-1/2 flex flex-col gap-8 pointer-events-none">
            <div class="space-y-1">
                <p class="text-[8px] font-headline text-on-surface-variant tracking-widest uppercase">Depth Range</p>
                <div class="h-32 w-1 bg-surface-container-high rounded-full overflow-hidden relative">
                    <div class="absolute bottom-0 w-full h-3/4 bg-primary-container shadow-[0_0_10px_#00E5FF]"></div>
                </div>
                <p class="font-mono text-[10px] text-primary-container">12.4m</p>
            </div>
            <div class="space-y-1">
                <p class="text-[8px] font-headline text-on-surface-variant tracking-widest uppercase">Proc Load</p>
                <div class="flex gap-0.5">
                    <div class="w-1.5 h-4 bg-primary-container"></div>
                    <div class="w-1.5 h-4 bg-primary-container"></div>
                    <div class="w-1.5 h-4 bg-primary-container"></div>
                    <div class="w-1.5 h-4 bg-surface-container-high"></div>
                </div>
                <p class="font-mono text-[10px] text-on-surface-variant">42ms</p>
            </div>
        </aside>
        <!-- Right Side Alerts -->
        <aside id="dynamic-alerts"
            class="fixed right-6 top-1/2 -translate-y-1/2 flex flex-col items-end gap-6 max-h-[65vh] overflow-y-auto hide-scrollbar pointer-events-auto">
            <!-- Dynamic alerts go here -->
        </aside>
    </div>
    <!-- UI Overlay for Vignette -->
    <div class="fixed inset-0 pointer-events-none shadow-[inset_0_0_50px_rgba(0,0,0,0.5)] z-20"></div>

    <script>
        const video = document.getElementById('cameraElement');
        const canvas = document.getElementById('canvasElement');
        const scanBtn = document.getElementById('scanBtn');
        const scanLabel = document.getElementById('scanLabel');
        let isScanning = false;
        let streamRef = null;

        async function startCamera() {
            try {
                streamRef = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = streamRef;
                video.play().catch(e => console.log("Play error: ", e));
            } catch (err) {
                console.warn("Environment camera failed, trying default camera...", err);
                try {
                    streamRef = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = streamRef;
                    video.play().catch(e => console.log("Play error: ", e));
                } catch (fallbackErr) {
                    console.error("Error accessing camera: ", fallbackErr);
                    alert("Please enable camera access for SIGHTRA to work properly.");
                }
            }
        }

        // Function to stop camera
        function stopCamera() {
            if (streamRef) {
                streamRef.getTracks().forEach(track => track.stop());
                streamRef = null;
                video.srcObject = null;
            }
        }

        // Request initial camera access to show feed before scanning
        startCamera();

        // Handle Scan Button Click
        scanBtn.addEventListener('click', () => {
            isScanning = !isScanning;

            if (isScanning) {
                // Ensure camera is running
                if (!streamRef) startCamera();
                scanLabel.innerText = "STOP SIGHT SCAN";
                scanLabel.classList.replace('text-primary-container', 'text-error');
                scanBtn.querySelector('.backdrop-blur-2xl').classList.replace('bg-primary-container/10', 'bg-error/20');
                scanBtn.querySelector('.material-symbols-outlined').style.color = '#ffb4ab';
                captureAndAnalyze();
            } else {
                scanLabel.innerText = "INITIATE SIGHT SCAN";
                scanLabel.classList.replace('text-error', 'text-primary-container');
                scanBtn.querySelector('.backdrop-blur-2xl').classList.replace('bg-error/20', 'bg-primary-container/10');
                scanBtn.querySelector('.material-symbols-outlined').style.color = '';

                window.speechSynthesis.cancel();
                clearDynamicUI();
                stopCamera();
            }
        });

        function clearDynamicUI() {
            document.getElementById('dynamic-boxes').innerHTML = `
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="relative w-48 h-48 flex items-center justify-center">
                    <div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-primary/30"></div>
                    <div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-primary/30"></div>
                    <div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-primary/30"></div>
                    <div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-primary/30"></div>
                    <div class="w-1 h-1 bg-primary-container rounded-full shadow-[0_0_15px_#00E5FF]"></div>
                </div>
            </div>`;
            document.getElementById('dynamic-alerts').innerHTML = '';
        }

        async function captureAndAnalyze() {
            if (!isScanning) return;

            // Draw current frame to canvas
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            if (canvas.width > 0 && canvas.height > 0) {
                canvas.getContext('2d').drawImage(video, 0, 0);
            }

            const frameData = canvas.toDataURL('image/jpeg', 0.5); // Compressing simple frame

            try {
                const response = await fetch('/api/navigation/stream/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        frame_data: frameData,
                        text_prompt: "Describe any obstacles or pathways ahead."
                    })
                });

                const data = await response.json();

                if (!isScanning) return; // check again after await

                updateDynamicUI(data.metadata);

                if (data.analysis_text) {
                    const speech = new SpeechSynthesisUtterance(data.analysis_text);
                    speech.onend = () => { if (isScanning) requestAnimationFrame(captureAndAnalyze); };
                    speech.onerror = () => { if (isScanning) setTimeout(captureAndAnalyze, 1000); };
                    window.speechSynthesis.speak(speech);
                } else {
                    setTimeout(captureAndAnalyze, 1000);
                }
            } catch (err) {
                console.error("Error sending frame: ", err);
                if (isScanning) setTimeout(captureAndAnalyze, 3000);
            }
        }

        function updateDynamicUI(metadata) {
            const boxesContainer = document.getElementById('dynamic-boxes');
            const alertsContainer = document.getElementById('dynamic-alerts');

            clearDynamicUI(); // Reset center guide

            if (!metadata || !metadata.objects) return;

            metadata.objects.forEach((obj, idx) => {
                const isObstacle = obj.label !== 'door';
                const theme = isObstacle ? 'secondary' : 'primary';
                const confPercent = Math.round(obj.confidence * 100) + '%';

                // Mapped coordinates (assuming standard [x,y,w,h])
                const [x, y, w, h] = obj.box;
                // Exaggerating sizing for visual effect if the mock values are too small
                const displayW = w * 2.5;
                const displayH = h * 2.5;

                const boxHtml = `
                <div class="absolute border-2 border-${theme}-container/40 rounded-lg transition-all duration-300"
                     style="left: ${x}px; top: ${y}px; width: ${displayW}px; height: ${displayH}px;">
                    <div class="absolute -top-10 ${isObstacle ? 'right-0 border-r-2 flex-row-reverse' : 'left-0 border-l-2'} bg-${theme}-container/20 backdrop-blur-md px-3 py-1 rounded-sm flex items-center gap-2 border-${theme}-container">
                        ${isObstacle ? '<span class="text-[10px] font-mono text-secondary-fixed mr-2">DETECTED</span>' : ''}
                        <span class="font-headline text-xs font-bold tracking-widest text-${theme}-container uppercase">${obj.label}</span>
                        ${isObstacle ? '<span class="material-symbols-outlined text-secondary-container text-xs" data-icon="warning">warning</span>' : `<span class="text-[10px] font-mono text-primary-fixed ml-2">${confPercent}</span>`}
                    </div>
                    ${isObstacle ? '<div class="absolute inset-0 bg-secondary-container/5 animate-pulse"></div>' : `
                        <div class="absolute -top-1 -left-1 w-4 h-4 border-t-2 border-l-2 border-primary-container"></div>
                        <div class="absolute -top-1 -right-1 w-4 h-4 border-t-2 border-r-2 border-primary-container"></div>
                        <div class="absolute -bottom-1 -left-1 w-4 h-4 border-b-2 border-l-2 border-primary-container"></div>
                        <div class="absolute -bottom-1 -right-1 w-4 h-4 border-b-2 border-r-2 border-primary-container"></div>
                    `}
                </div>`;
                boxesContainer.insertAdjacentHTML('beforeend', boxHtml);

                const alertHtml = `
                <div class="bg-surface-container-low/60 backdrop-blur-md p-4 rounded-xl border-r-4 border-${theme}-container max-w-[120px] animate-fade-in-right">
                    <p class="font-headline text-[10px] font-black text-${theme}-container mb-1 tracking-widest">${obj.label.toUpperCase()}</p>
                    <p class="font-body text-[10px] leading-tight text-on-surface-variant">Detected with ${confPercent} confidence.</p>
                </div>`;
                alertsContainer.insertAdjacentHTML('beforeend', alertHtml);
            });
        }
    </script>
</body>

</html>
