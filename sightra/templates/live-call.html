<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sightra Connect - Live Call</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;family=Inter:wght@100..900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#0e0e0e",
                        "outline-variant": "#3b494c",
                        "on-secondary-container": "#556d00",
                        "surface-container": "#201f1f",
                        "surface": "#131313",
                        "on-tertiary-fixed-variant": "#594400",
                        "secondary-fixed": "#c3f400",
                        "secondary-container": "#c3f400",
                        "surface-dim": "#131313",
                        "on-surface": "#e5e2e1",
                        "surface-container-highest": "#353534",
                        "secondary-fixed-dim": "#abd600",
                        "tertiary-fixed-dim": "#f3bf26",
                        "outline": "#849396",
                        "surface-tint": "#00daf3",
                        "inverse-on-surface": "#313030",
                        "on-tertiary": "#3e2e00",
                        "tertiary-fixed": "#ffdf96",
                        "on-secondary-fixed": "#161e00",
                        "on-primary-fixed": "#001f24",
                        "surface-container-high": "#2a2a2a",
                        "primary-container": "#00e5ff",
                        "on-primary-fixed-variant": "#004f58",
                        "primary-fixed-dim": "#00daf3",
                        "on-error": "#690005",
                        "inverse-surface": "#e5e2e1",
                        "on-secondary-fixed-variant": "#3c4d00",
                        "surface-bright": "#393939",
                        "on-surface-variant": "#bac9cc",
                        "on-secondary": "#283500",
                        "surface-container-low": "#1c1b1b",
                        "surface-variant": "#353534",
                        "tertiary": "#ffeac0",
                        "inverse-primary": "#006875",
                        "on-error-container": "#ffdad6",
                        "on-background": "#e5e2e1",
                        "error-container": "#93000a",
                        "primary": "#c3f5ff",
                        "on-tertiary-container": "#6f5500",
                        "on-primary-container": "#00626e",
                        "primary-fixed": "#9cf0ff",
                        "tertiary-container": "#fec931",
                        "on-tertiary-fixed": "#251a00",
                        "error": "#ffb4ab",
                        "on-primary": "#00363d",
                        "secondary": "#ffffff",
                        "background": "#131313"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Lexend"],
                        "display": ["Lexend"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(19, 19, 19, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-surface text-on-surface font-body overflow-hidden h-screen w-screen">
    <!-- Top Navigation Anchor -->
    <header
        class="fixed top-0 w-full z-50 bg-[#131313]/80 backdrop-blur-xl border-b border-[#00E5FF]/20 flex justify-between items-center px-6 h-16 w-full shadow-[0_0_20px_rgba(0,229,255,0.1)]">
        <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
            <span class="material-symbols-outlined text-[#00E5FF] text-2xl" data-icon="visibility">visibility</span>
            <h1
                class="font-['Lexend'] tracking-widest uppercase font-bold text-2xl font-black text-[#00E5FF] tracking-tighter">
                Sightra</h1>
        </a>

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center gap-8" id="desktopNav">
            <a href="/" data-target="/"
                class="nav-link flex items-center gap-2 text-[#BAC9CC] hover:text-[#00E5FF] transition-colors font-medium text-sm">
                <span class="material-symbols-outlined text-[20px]">home</span>
                Home
            </a>
            <a href="/vision/" data-target="/vision"
                class="nav-link flex items-center gap-2 text-[#BAC9CC] hover:text-[#00E5FF] transition-colors font-medium text-sm">
                <span class="material-symbols-outlined text-[20px]">visibility</span>
                Vision
            </a>
            <a href="/voice_assistant/" data-target="/voice_assistant"
                class="nav-link flex items-center gap-2 text-[#BAC9CC] hover:text-[#00E5FF] transition-colors font-medium text-sm">
                <span class="material-symbols-outlined text-[20px]">mic</span>
                Voice
            </a>
            <a href="/settings/" data-target="/settings"
                class="nav-link flex items-center gap-2 text-[#BAC9CC] hover:text-[#00E5FF] transition-colors font-medium text-sm">
                <span class="material-symbols-outlined text-[20px]">settings</span>
                Settings
            </a>
        </nav>
    </header>
    <!-- Main Viewport: User's Perspective (Full Screen) -->
    <main
        class="relative h-screen w-screen bg-surface-container-lowest flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img alt="Main video feed" class="w-full h-full object-cover grayscale-[0.2]"
                data-alt="A first-person perspective point-of-view shot of a busy urban sidewalk during a bright, sunny day. The scene shows clear concrete textures, shadows of pedestrians, and vibrant storefronts in the distance. The overall lighting is high-contrast and sharp, following a clean, futuristic aesthetic with deep blacks and bright daylight tones, conveying a sense of active navigation and movement."
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuAbUJb95hjuqq1qAbVSakmzTEOeH5zQgpBpWLpSTZnnlj-7ziX7JjoosTM2zkFv_QtTXEK6Ontcd4hWUxYGTSSqvv8dw0yaxGqHKAhifaBTD4A38sry5OIoZJ44l582kzqybTKkVVKODrxcqbe8PW9zyZ0WDd5oqgI3cZnDco2rbTEGQhkre-dN1uWx1iZEm9-fWpUlQLofBUxqVMkEShX09dGHewHHHqgQEDUVqxHztVBwx74PkcEncsPZmryFVleVKP7JY5D9-dxg" />
            <!-- AI Vision Overlays -->
            <div class="absolute inset-0 pointer-events-none border-[12px] border-primary-container/10">
                <div class="absolute top-1/4 left-1/4 w-48 h-48 border-2 border-primary-container/40 rounded-2xl">
                    <div
                        class="absolute -top-6 left-0 bg-primary-container text-on-primary-container px-3 py-1 font-headline text-[10px] tracking-tighter font-black rounded-sm">
                        OBSTACLE: STEP</div>
                </div>
                <div class="absolute bottom-1/3 right-1/4 w-64 h-32 border-2 border-secondary-container/40 rounded-2xl">
                    <div
                        class="absolute -top-6 left-0 bg-secondary-container text-on-secondary-container px-3 py-1 font-headline text-[10px] tracking-tighter font-black rounded-sm">
                        PATH CLEAR</div>
                </div>
            </div>
        </div>
        <!-- Volunteer Inset View -->
        <div
            class="absolute top-24 right-6 w-40 h-56 rounded-2xl overflow-hidden shadow-2xl border-2 border-surface-container-highest z-20">
            <img alt="Volunteer face" class="w-full h-full object-cover"
                data-alt="A professional and friendly female volunteer with a warm smile, wearing a modern headset, looking directly into the camera. She is set against a soft-focus, minimalist office background with cool blue and charcoal tones. The lighting is flattering and professional, emphasizing clarity and human connection within a high-tech communication interface."
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8QA7xTlGYp6y4BU7ZL6DVYu62d4-5PcErWA8orRfrVOluhkHwfIDalnqPPbyHv3D8HKDW4AnZQoDF7TjGJJcTYDf54CI0A-UDxdALHr37s2ZeJvpdoXh30UXGtRjmhIdfLf2Gw7Y35uSjYlphmF_sDfml3jz5XuI1IrC56TzVscZCWcNl7tanl3zBFP4NxfL2rpKA9f7wajQfchK32K5k1QcTuCRdHdPj-LxsSk_YVBtK7fizIRCOw7Jd2q-R6T-EmnTrr6zo8tY0" />
            <div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-surface to-transparent">
                <p class="text-[10px] font-headline font-bold uppercase tracking-widest text-primary-container">Live:
                    Sarah</p>
            </div>
        </div>
        <!-- Connection Status & Guidance Text -->
        <div class="absolute top-24 left-6 z-20 flex flex-col gap-4">
            <div
                class="glass-panel px-6 py-3 rounded-2xl flex items-center gap-3 border-l-4 border-secondary-container shadow-lg">
                <div class="w-2 h-2 rounded-full bg-secondary-container animate-pulse"></div>
                <p class="font-headline text-sm font-bold tracking-tight text-on-surface">Connected to: Sarah
                    (Volunteer)</p>
            </div>
            <div class="bg-surface-container-highest/80 backdrop-blur-md px-6 py-4 rounded-2xl max-w-xs shadow-xl">
                <p class="font-body text-xs leading-relaxed text-on-surface-variant italic">
                    "Volunteer is viewing your feed. Keep your device steady for better recognition."
                </p>
            </div>
        </div>
        <!-- Interaction Overlay Controls -->
        <div class="absolute bottom-32 left-0 right-0 z-30 px-6 flex justify-center items-center gap-6">
            <!-- Mute Toggle -->
            <button
                class="w-16 h-16 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all active:scale-95 group">
                <span class="material-symbols-outlined text-3xl group-hover:text-primary">mic</span>
            </button>
            <!-- End Call (Primary Action) -->
            <a href="/sightra-connect/"
                class="px-10 h-20 rounded-full bg-error-container text-on-error-container flex items-center gap-4 shadow-[0_0_30px_rgba(147,0,10,0.3)] hover:brightness-110 transition-all active:scale-95">
                <span class="material-symbols-outlined text-3xl"
                    style="font-variation-settings: 'FILL' 1;">call_end</span>
                <span class="font-headline font-black uppercase tracking-tighter text-xl">End Call</span>
            </a>
            <!-- AI Overlay Toggle (Active State Example) -->
            <button
                class="w-16 h-16 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shadow-[0_0_20px_rgba(0,229,255,0.4)] transition-all active:scale-95">
                <span class="material-symbols-outlined text-3xl"
                    style="font-variation-settings: 'FILL' 1;">visibility</span>
            </button>
        </div>
        <!-- Bottom Assistance Bar -->
        <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-full max-w-md px-6 z-40">
            <div
                class="bg-surface-container-low rounded-2xl p-4 border-t-2 border-primary-container/20 flex items-center justify-between shadow-2xl">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-primary-container">info</span>
                    <div>
                        <p
                            class="text-[10px] font-headline font-black uppercase text-on-surface-variant tracking-widest">
                            Network Health</p>
                        <p class="text-xs font-body font-bold text-on-surface">Excellent (24ms latency)</p>
                    </div>
                </div>
                <div class="flex gap-1">
                    <div class="w-1 h-3 bg-primary-container rounded-full"></div>
                    <div class="w-1 h-3 bg-primary-container rounded-full"></div>
                    <div class="w-1 h-3 bg-primary-container rounded-full"></div>
                    <div class="w-1 h-3 bg-primary-container rounded-full"></div>
                </div>
            </div>
        </div>
    </main>
    <!-- Bottom Navigation Shell (Contextually suppressed for transactional/task focused page as per rule, but rendered if needed by shell logic) -->
    <!-- Navigation suppressed to prioritize focus on the live call canvas. -->
</body>

</html>
