<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sightra Connect - Live Call</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00E5FF",
                        "surface": "#131313",
                        "surface-variant": "#201f1f",
                        "on-surface": "#e5e2e1",
                        "error": "#FF4B4B",
                    },
                    fontFamily: {
                        "headline": ["Lexend"],
                        "body": ["Inter"],
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(19, 19, 19, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .pulse-red {
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 75, 75, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 75, 75, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 75, 75, 0); }
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>

<body class="bg-surface text-on-surface font-body overflow-hidden h-screen w-screen">
    <!-- Header -->
    <header class="fixed top-0 w-full z-50 bg-surface/40 backdrop-blur-xl border-b border-white/5 flex justify-between items-center px-6 h-16 shadow-lg">
        <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
            <span class="material-symbols-outlined text-primary text-2xl">visibility</span>
            <h1 class="font-headline font-black text-xl uppercase tracking-tighter text-primary">Sightra</h1>
        </a>

        <div id="connection-status" class="flex items-center gap-2 glass-panel px-4 py-1.5 rounded-full border-white/10">
            <div class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse" id="status-dot"></div>
            <span class="text-xs font-bold uppercase tracking-widest text-on-surface/80" id="status-text">Initializing...</span>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden md:flex flex-col items-end">
                <span class="text-[10px] text-on-surface/40 uppercase font-black tracking-widest">Call Duration</span>
                <span id="call-timer" class="text-sm font-headline font-bold">00:00</span>
            </div>
        </div>
    </header>

    <main class="relative h-screen w-screen bg-black overflow-hidden">
        <!-- Main Video Container -->
        <div id="main-video-container" class="video-container absolute inset-0 z-0 bg-surface-variant flex items-center justify-center">
            <video id="localVideo" class="w-full h-full object-cover" autoplay playsinline muted></video>
            <div class="absolute inset-0 flex flex-col items-center justify-center bg-surface-variant z-10" id="local-placeholder">
                <span class="material-symbols-outlined text-6xl animate-pulse text-primary">videocam</span>
                <p class="text-sm uppercase tracking-widest font-black mt-4" id="placeholder-text">Waiting for camera...</p>
                <button onclick="requestCameraAccess()" class="mt-6 px-8 py-3 bg-primary text-black rounded-full text-xs font-black uppercase tracking-widest hover:scale-105 transition-all">Enable Camera</button>
            </div>
        </div>

        <!-- Floating Video Container -->
        <div class="absolute top-24 right-6 w-40 h-56 rounded-2xl overflow-hidden shadow-2xl border-2 border-white/10 z-20 glass-panel group transition-all duration-300 hover:scale-105" id="pip-video-wrapper">
            <div id="pip-video-container" class="video-container w-full h-full bg-surface-variant flex items-center justify-center">
                <!-- If volunteer, local goes here. If user, remote goes here. -->
                <div class="text-center space-y-2 opacity-40" id="pip-placeholder">
                    <span class="material-symbols-outlined text-4xl">person_search</span>
                </div>
            </div>
            <div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/80 to-transparent">
                <p class="text-[10px] font-bold uppercase tracking-widest text-primary" id="pip-name">Remote</p>
            </div>
        </div>

        <!-- Guidance Overlay -->
        <div class="absolute top-24 left-6 z-20 max-w-xs space-y-3" id="guidance-overlay">
            <div class="glass-panel p-4 rounded-2xl shadow-xl border-l-4 border-primary">
                <p class="text-xs leading-relaxed text-on-surface/90 italic" id="guidance-text">
                    "Streaming your environment to a volunteer. Keep your device steady."
                </p>
            </div>
        </div>

        <!-- Call Controls -->
        <div class="absolute bottom-10 left-0 right-0 z-40 flex flex-col items-center gap-6">
            <div class="glass-panel p-4 rounded-full flex items-center gap-4 shadow-2xl backdrop-blur-2xl border-white/10">
                <button id="mic-toggle" class="w-14 h-14 rounded-full flex items-center justify-center transition-all hover:bg-white/10 active:scale-90 group">
                    <span class="material-symbols-outlined text-2xl group-hover:text-primary" id="mic-icon">mic</span>
                </button>
                <button id="camera-toggle" class="w-14 h-14 rounded-full flex items-center justify-center transition-all hover:bg-white/10 active:scale-90 group">
                    <span class="material-symbols-outlined text-2xl group-hover:text-primary" id="camera-icon">videocam</span>
                </button>
                <button id="end-call" class="w-20 h-14 bg-error text-white rounded-full flex items-center justify-center shadow-lg shadow-error/30 hover:brightness-110 active:scale-95 transition-all">
                    <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">call_end</span>
                </button>
                <button class="w-14 h-14 rounded-full flex items-center justify-center transition-all hover:bg-white/10 active:scale-90">
                    <span class="material-symbols-outlined text-2xl">info</span>
                </button>
            </div>
            <div class="px-6 py-2 rounded-full glass-panel border-primary/20 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-primary animate-ping"></span>
                <span class="text-[10px] font-black uppercase tracking-[0.2em] text-primary" id="role-tag">USER MODE</span>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'user';
        const isVolunteer = role === 'volunteer';

        document.getElementById('role-tag').innerText = isVolunteer ? 'VOLUNTEER MODE' : 'USER MODE';
        document.getElementById('guidance-text').innerText = isVolunteer ? 
            "Viewing user's environment. Provide clear audio guidance." : 
            "Streaming your environment to a volunteer. Keep your device steady.";

        let room = null;
        let localStream = null;
        let startTime = null;
        let timerInterval = null;
        const livekitUrl = "{{ livekit_url }}";
        const roomName = "sightra-call";

        async function requestCameraAccess() {
            const placeholder = document.getElementById('local-placeholder');
            const statusText = document.getElementById('placeholder-text');
            
            try {
                // For volunteers, we use front camera. For users, environment camera.
                const constraints = {
                    video: { facingMode: isVolunteer ? "user" : "environment" },
                    audio: true
                };
                
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                const videoElement = document.getElementById('localVideo');
                
                if (isVolunteer) {
                    // For volunteers, their own face goes to PiP, Remote (User) goes to Main.
                    // But we start by showing their face in main until connected.
                    videoElement.srcObject = localStream;
                } else {
                    // For users, environment goes to main.
                    videoElement.srcObject = localStream;
                }
                
                placeholder.classList.add('hidden');
                updateStatus('Camera Ready', 'yellow');
                initLiveKit();
            } catch (err) {
                console.error("Camera access failed:", err);
                updateStatus('Camera Error', 'red');
            }
        }

        async function initLiveKit() {
            if (typeof LiveKitClient === 'undefined') return;
            
            try {
                updateStatus('Connecting...', 'yellow');
                const response = await fetch(`/api/volunteer/token/?room=${roomName}&role=${role}`);
                const data = await response.json();
                
                const { Room, RoomEvent } = LiveKitClient;
                room = new Room({ adaptiveStream: true, dynacast: true });

                room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === 'video') {
                        const element = track.attach();
                        
                        if (isVolunteer) {
                            // Volunteer sees the User (Remote) in Main, and themselves (Local) in PiP.
                            // Move local video to PiP
                            const pipContainer = document.getElementById('pip-video-container');
                            const localVideo = document.getElementById('localVideo');
                            
                            // Re-attach local to PiP
                            pipContainer.innerHTML = '';
                            const newLocalVideo = document.createElement('video');
                            newLocalVideo.srcObject = localStream;
                            newLocalVideo.autoplay = true;
                            newLocalVideo.muted = true;
                            newLocalVideo.className = 'w-full h-full object-cover';
                            pipContainer.appendChild(newLocalVideo);
                            document.getElementById('pip-placeholder').classList.add('hidden');
                            document.getElementById('pip-name').innerText = 'You';

                            // Attach remote to Main
                            const mainContainer = document.getElementById('main-video-container');
                            mainContainer.innerHTML = '';
                            element.className = 'w-full h-full object-cover';
                            mainContainer.appendChild(element);
                        } else {
                            // User sees themselves (Local) in Main, and Volunteer (Remote) in PiP.
                            const pipContainer = document.getElementById('pip-video-container');
                            pipContainer.innerHTML = '';
                            element.className = 'w-full h-full object-cover';
                            pipContainer.appendChild(element);
                            document.getElementById('pip-placeholder').classList.add('hidden');
                            document.getElementById('pip-name').innerText = participant.identity || 'Volunteer';
                        }
                    } else if (track.kind === 'audio') {
                        track.attach();
                    }
                });

                room.on(RoomEvent.Connected, () => {
                    updateStatus('Connected Live', 'green');
                    startTimer();
                });

                await room.connect(livekitUrl, data.token);
                
                const videoTrack = localStream.getVideoTracks()[0];
                const audioTrack = localStream.getAudioTracks()[0];
                if (videoTrack) await room.localParticipant.publishTrack(videoTrack);
                if (audioTrack) await room.localParticipant.publishTrack(audioTrack);

            } catch (error) {
                console.error('LiveKit connection failed:', error);
            }
        }

        function updateStatus(text, color) {
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            statusText.innerText = text;
            statusDot.className = 'w-2 h-2 rounded-full';
            if (color === 'green') statusDot.classList.add('bg-green-500');
            else if (color === 'red') statusDot.classList.add('bg-error', 'pulse-red');
            else if (color === 'yellow') statusDot.classList.add('bg-yellow-400', 'animate-pulse');
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const min = Math.floor(elapsed / 60000).toString().padStart(2, '0');
                const sec = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('call-timer').innerText = `${min}:${sec}`;
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        document.getElementById('end-call').addEventListener('click', () => {
            if (room) room.disconnect();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            window.location.href = '/';
        });

        window.addEventListener('load', requestCameraAccess);
    </script>
</body>

</html>
